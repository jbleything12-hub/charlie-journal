<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Charlie's Journal</title>
<meta name="description" content="Food and bathroom log for Charlie" />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2F87BB" />
<link rel="icon" href="icons/icon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Charlie" />
<meta name="mobile-web-app-capable" content="yes" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app"></div>

  <div id="signin-overlay" class="hidden">
    <div class="signin-card">
      <img class="signin-mark" src="icons/icon-192.png" alt="" />
      <h2>Sign in to Charlie&rsquo;s Journal</h2>
      <p>Sign in once so the log backs up automatically from here on.</p>
      <div class="field"><label for="signin-email">Email</label>
        <input type="email" id="signin-email" autocomplete="username" /></div>
      <div class="field"><label for="signin-password">Password</label>
        <input type="password" id="signin-password" autocomplete="current-password" /></div>
      <div id="signin-error" class="signin-error"></div>
      <button type="button" class="btn-primary" style="width:100%;" id="signin-submit">Sign in</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
